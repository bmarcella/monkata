

<!-- Popular Section -->
<section class="popular-section popular-eight"  id="free-cv"  style="margin-top: 120px">
  <div class="container">
    <div class="section-heading">
      <h2 class="text-center">Deposez votre <span>CV</span></h2>
      <h4>
        Faites-vous recruter par des entreprises à la recherche de talents comme le vôtre, dans tous les domaines.
      </h4>
      <p class="vaca-para">
        Libérez votre potentiel professionnel : créez un profil captivant, découvrez des opportunités d'emploi sur mesure et connectez-vous avec les meilleurs employeurs.
      </p>
    </div>
    <div class="popular-details" style="margin-top: -2.5%">
      <div class="container">
        <div class="row">
          <div class="col-md-12">
            <app-form-ano [type_cv]="false"></app-form-ano>
          </div>
        </div>
      </div>
    </div>

    <div class="pop-bg-one">
      <img src="assets/img/popular-bg-1.png" alt="no-img" />
    </div>
    <div class="pop-bg-two">
      <img src="assets/img/popular-bg-2.png" alt="no-img" />
    </div>
  </div>
</section>
<!-- /Popular Section -->
